# Metrics from the agents arrive by remote write (--web.enable-remote-write-receiver);
# the only scrapes here are the uptime probes and the stack itself.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["obs-alertmanager:9093"]

scrape_configs:
  # Uptime: every URL in uptime/*.yml, probed from here (outside the apps'
  # servers). Each target carries project, env, service and module labels.
  - job_name: uptime
    scrape_interval: 60s
    scrape_timeout: 15s
    metrics_path: /probe
    file_sd_configs:
      - files: ["/etc/prometheus/uptime/*.yml"]
        refresh_interval: 1m
    relabel_configs:
      - source_labels: [module]
        target_label: __param_module
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: obs-blackbox:9115

  # The stack watches itself (project "overbrand").
  - job_name: observability
    static_configs:
      - targets:
          - localhost:9090
          - obs-alertmanager:9093
          - obs-loki:3100
          - obs-grafana:3000
          - obs-blackbox:9115
        labels: { project: overbrand, env: production }
    relabel_configs:
      - source_labels: [__address__]
        regex: "(?:obs-)?([a-z]+):.*"
        replacement: "$1"
        target_label: service
      - source_labels: [service]
        regex: localhost
        replacement: prometheus
        target_label: service
