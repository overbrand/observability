apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://obs-prometheus:9090
    isDefault: true
    jsonData: { timeInterval: 30s }
  - name: Loki
    uid: loki
    type: loki
    url: http://obs-loki:3100
    jsonData: { maxLines: 2000 }
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    url: http://obs-alertmanager:9093
    jsonData: { implementation: prometheus, handleGrafanaManagedAlerts: false }
