apiVersion: 1
providers:
  # grafana/dashboards/<Folder>/*.json → a Grafana folder of the same name:
  # Overbrand (generic, every project) and one folder per project.
  - name: overbrand
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
