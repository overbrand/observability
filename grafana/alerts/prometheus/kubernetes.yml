# Kubernetes clusters (alloy-k8s: kube-state-metrics, kubelet, cAdvisor).
# Labels: project, env, cluster, namespace, plus pod/container/service.
groups:
  - name: kubernetes
    rules:
      - alert: PodCrashLooping
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is crash-looping"

      - alert: PodNotReady
        expr: |
          sum by (project, env, cluster, namespace, pod) (
            kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}
          ) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} not running for 10 minutes"

      - alert: ContainerNearMemoryLimit
        expr: |
          sum by (project, env, cluster, namespace, pod, container) (container_memory_working_set_bytes{container!=""})
            / sum by (project, env, cluster, namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
            > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) at {{ $value | humanizePercentage }} of its memory limit"

      - alert: ContainerCpuThrottled
        expr: |
          sum by (project, env, cluster, namespace, pod, container) (rate(container_cpu_cfs_throttled_periods_total[5m]))
            / sum by (project, env, cluster, namespace, pod, container) (rate(container_cpu_cfs_periods_total[5m]))
            > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is CPU-throttled {{ $value | humanizePercentage }} of the time"

      - alert: HpaAtMaximum
        expr: |
          kube_horizontalpodautoscaler_status_current_replicas
            >= kube_horizontalpodautoscaler_spec_max_replicas
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler }} has been at its maximum replicas for 15 minutes"

      - alert: VolumeAlmostFull
        expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} at {{ $value | humanizePercentage }}"

      # Any failed Job, e.g. the nightly mongodb-backup CronJob.
      - alert: JobFailed
        expr: kube_job_status_failed > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Job {{ $labels.namespace }}/{{ $labels.job_name }} failed"

      - alert: NodeNotReady
        expr: kube_node_status_condition{condition="Ready", status="true"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Node {{ $labels.node }} is not ready"
