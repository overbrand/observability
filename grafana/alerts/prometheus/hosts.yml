# Machines (VPS, AKS nodes) and the agents themselves. Host metrics carry
# project, env and host (alloy-docker) or cluster/instance (alloy-k8s).
groups:
  - name: agents
    rules:
      # A project/env that sent metrics in the last hour and sends none now:
      # its agent, or its whole machine, is gone.
      - alert: AgentSilent
        expr: |
          group by (project, env) (max_over_time(up{project!="", project!="overbrand"}[1h]))
          unless group by (project, env) (up{project!=""})
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No metrics from {{ $labels.project }} {{ $labels.env }} for 5 minutes"
          description: "The monitoring agent or the machine it runs on is down."

  - name: hosts
    rules:
      - alert: HostCpuHigh
        expr: 1 - avg by (project, env, host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} CPU at {{ $value | humanizePercentage }} for 15 minutes"

      - alert: HostMemoryHigh
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} memory at {{ $value | humanizePercentage }}"

      - alert: HostDiskFilling
        expr: |
          1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"} > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} disk {{ $labels.mountpoint }} at {{ $value | humanizePercentage }}"

      - alert: HostDiskFilling
        expr: |
          1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|nsfs"} > 0.95
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.host }} disk {{ $labels.mountpoint }} at {{ $value | humanizePercentage }}"
