# Overbrand agent for a Kubernetes cluster: grafana/k8s-monitoring 4.6.1.
#
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install overbrand-agent grafana/k8s-monitoring --version 4.6.1 \
#     -n monitoring --create-namespace -f values.yaml \
#     --set cluster.name=bns-aks \
#     --set destinations.overbrand-metrics.extraLabels.project=bns \
#     --set destinations.overbrand-logs.extraLabels.project=bns \
#     --set destinations.overbrand-metrics.auth.username=bns-aks \
#     --set destinations.overbrand-metrics.auth.password=$INGEST_PASSWORD   # (same for overbrand-logs)
#
# BNS installs it from its Pulumi stack (infra/src/kubernetes/observability.ts),
# with these same values.
#
# Sends: pod logs (project, env, service, namespace, pod, container), cluster
# state (kube-state-metrics), kubelet/cAdvisor container metrics, node
# metrics (node exporter) and Kubernetes events — every series labelled
# project/env (from the destinations) and service.

cluster:
  name: CHANGE-ME # e.g. bns-aks

destinations:
  overbrand-metrics:
    type: prometheus
    url: https://ingest.overbrand.net/api/v1/write
    auth: { type: basic, username: CHANGE-ME, password: CHANGE-ME }
    extraLabels: { project: CHANGE-ME, env: production }
  overbrand-logs:
    type: loki
    url: https://ingest.overbrand.net/loki/api/v1/push
    auth: { type: basic, username: CHANGE-ME, password: CHANGE-ME }
    extraLabels: { project: CHANGE-ME, env: production }

collectors:
  alloy-metrics:
    presets: [clustered, statefulset]
  alloy-logs:
    presets: [filesystem-log-reader, daemonset]
  alloy-singleton:
    presets: [singleton]

telemetryServices:
  kube-state-metrics: { deploy: true }
  node-exporter: { deploy: true }

clusterMetrics:
  enabled: true
  collector: alloy-metrics
  # The generic dashboards and alerts group by `service`: the container name.
  cadvisor:
    extraMetricProcessingRules: |
      rule {
        source_labels = ["container"]
        regex         = "(.+)"
        target_label  = "service"
      }
  kube-state-metrics:
    extraMetricProcessingRules: |
      rule {
        source_labels = ["container"]
        regex         = "(.+)"
        target_label  = "service"
      }

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
    metricsTuning:
      includeMetrics: [node_load1, node_uname_info]
    # The Hosts dashboard and alerts name a machine by `host`.
    extraMetricProcessingRules: |
      rule {
        source_labels = ["instance"]
        target_label  = "host"
      }

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs
  # service = the pod's `app` label (BNS: api, web, chat-service, …),
  # else app.kubernetes.io/name, else the container name.
  labels:
    service: app
    app_kubernetes_io_name: app.kubernetes.io/name
  extraDiscoveryRules: |
    rule {
      source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
      regex         = "(.+)"
      target_label  = "service"
    }
    rule {
      source_labels = ["__meta_kubernetes_pod_label_app"]
      regex         = "(.+)"
      target_label  = "service"
    }
    rule {
      source_labels = ["service", "__meta_kubernetes_pod_container_name"]
      regex         = ";(.+)"
      target_label  = "service"
    }
